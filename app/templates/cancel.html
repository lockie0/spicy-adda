{% extends 'base.html' %}
{% block content %}
<section class="container auth-page">
    <div class="auth-card">
        <h2>Payment Cancelled</h2>
        <p>Your order #{{ order.id }} has been marked as cancelled. You can return to the shop to try again later.</p>
        <a href="{{ url_for('shop.products') }}" class="btn btn-primary">Continue Shopping</a>
        <a href="{{ url_for('orders.history') }}" class="btn btn-secondary">View Orders</a>
    </div>
</section>
{% endblock %}
