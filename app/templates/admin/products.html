{% extends 'base.html' %}
{% block content %}
<section class="container admin-products">
    <div class="admin-actions">
        <h2>Product Management</h2>
        <a href="{{ url_for('admin.add_product') }}" class="btn btn-primary">Add New Product</a>
    </div>
    <div class="admin-table">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                    <tr>
                        <td>{{ product.name }}</td>
                        <td>{{ product.category.name }}</td>
                        <td>₹{{ product.price }}</td>
                        <td>{{ product.stock }}</td>
                        <td>
                            <a href="{{ url_for('admin.edit_product', product_id=product.id) }}" class="btn btn-secondary">Edit</a>
                            <form action="{{ url_for('admin.delete_product', product_id=product.id) }}" method="post" class="inline-form">
                                {{ csrf_token() }}
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
