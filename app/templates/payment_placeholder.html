{% extends 'base.html' %}
{% block content %}
<section class="container auth-page">
    <div class="auth-card">
        <h2>Payment Placeholder</h2>
        <p>This app includes a placeholder for payment integration. Replace this page with your Stripe or Razorpay checkout flow.</p>
        <p>Order #{{ order.id }} is ready to complete.</p>
        <a href="{{ url_for('orders.success', order_id=order.id) }}" class="btn btn-primary">Simulate Success</a>
        <a href="{{ url_for('orders.cancel', order_id=order.id) }}" class="btn btn-secondary">Cancel Payment</a>
    </div>
</section>
{% endblock %}
